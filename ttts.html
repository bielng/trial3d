<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taban 3D Facial - Three.js</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #000;
      }

      /* ── Fullscreen video background ── */
      #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      #bg-video iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* oversize to cover all aspect ratios */
        width: 177.78vh; /* 16/9 * 100vh */
        height: 56.25vw; /* 9/16 * 100vw */
        min-width: 100%;
        min-height: 100%;
        border: none;
      }

      /* Three.js canvas sits on top of the video */
      canvas {
        position: relative;
        z-index: 1;
      }

      /* ── Button group container ── */
      #btn-group {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 200;

        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      /* ── Apple-style CTA button ── */
      .cta-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        padding: 14px 28px;
        border-radius: 980px;
        border: none;
        cursor: pointer;
        text-decoration: none;

        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);

        font-family:
          -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #000;

        transition:
          background 0.25s ease,
          transform 0.2s ease,
          box-shadow 0.25s ease;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      }

      .cta-btn:hover {
        background: rgba(0, 0, 0, 1);
        color: #ffffff;
        transform: scale(1.03);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }

      .cta-btn:active {
        transform: scale(0.98);
      }

      .cta-btn .arrow {
        font-size: 13px;
        opacity: 0.7;
        transition: transform 0.2s ease;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Fullscreen Mux video background -->
    <div id="bg-video">
      <iframe
        src="https://player.mux.com/HoBUaxPqOOK00SJ4QpdlmvQRDbFrHLQGz9sCyX65NZb00?loop=true&autoplay=true&muted=true&controls=false&preload=auto"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen
      ></iframe>
    </div>

    <!-- Button group -->
    <div id="btn-group">
      <a
        class="cta-btn"
        href="https://dayomtech.vercel.app/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit My Startup <span class="arrow">→</span>
      </a>
      <a
        class="cta-btn"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit My Portfolio <span class="arrow">→</span>
      </a>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      // ─── Global Uniforms ──────────────────────────────────────────────────────
      const gu = {
        time: { value: 0 },
        dTime: { value: 0 },
        aspect: { value: innerWidth / innerHeight },
      };

      // ─── Blob (framebuffer feedback paint) ───────────────────────────────────
      class Blob {
        constructor(renderer) {
          this.renderer = renderer;

          this.fbTexture = {
            value: new THREE.FramebufferTexture(innerWidth, innerHeight),
          };
          this.rtOutput = new THREE.WebGLRenderTarget(innerWidth, innerHeight);

          this.uniforms = {
            pointer: { value: new THREE.Vector2().setScalar(10) },
            pointerDown: { value: 1 },
            pointerRadius: { value: 0.375 },
            pointerDuration: { value: 2.5 },
          };

          window.addEventListener("pointermove", (e) => {
            this.uniforms.pointer.value.x =
              (e.clientX / window.innerWidth) * 2 - 1;
            this.uniforms.pointer.value.y =
              -(e.clientY / window.innerHeight) * 2 + 1;
          });

          renderer.domElement.addEventListener("pointerleave", () => {
            this.uniforms.pointer.value.setScalar(10);
          });

          this.rtScene = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.MeshBasicMaterial({
              color: 0x000000,
              onBeforeCompile: (shader) => {
                shader.uniforms.dTime = gu.dTime;
                shader.uniforms.aspect = gu.aspect;
                shader.uniforms.pointer = this.uniforms.pointer;
                shader.uniforms.pointerDown = this.uniforms.pointerDown;
                shader.uniforms.pointerRadius = this.uniforms.pointerRadius;
                shader.uniforms.pointerDuration = this.uniforms.pointerDuration;
                shader.uniforms.fbTexture = this.fbTexture;

                shader.fragmentShader = `
                uniform float dTime;
                uniform float aspect;
                uniform vec2  pointer;
                uniform float pointerDown;
                uniform float pointerRadius;
                uniform float pointerDuration;
                uniform sampler2D fbTexture;
                ${shader.fragmentShader}
              `.replace(
                  `#include <color_fragment>`,
                  `#include <color_fragment>

                float duration = pointerDuration;
                float rVal = texture2D(fbTexture, vUv).r;

                rVal -= clamp(dTime / duration, 0., 0.1);
                rVal  = clamp(rVal, 0., 1.);

                float f = 0.;
                if (pointerDown > 0.5) {
                  vec2 uv    = (vUv - 0.5) * 2. * vec2(aspect, 1.);
                  vec2 mouse = pointer * vec2(aspect, 1.);
                  f = 1. - smoothstep(pointerRadius * 0.1, pointerRadius, distance(uv, mouse));
                }
                rVal += f * 0.1;
                rVal  = clamp(rVal, 0., 1.);
                diffuseColor.rgb = vec3(rVal);
                `,
                );
              },
            }),
          );
          this.rtScene.material.defines = { USE_UV: "" };
          this.rtCamera = new THREE.Camera();
        }

        render() {
          this.renderer.setRenderTarget(this.rtOutput);
          this.renderer.render(this.rtScene, this.rtCamera);
          this.renderer.copyFramebufferToTexture(this.fbTexture.value);
          this.renderer.setRenderTarget(null);
        }

        setSize(w, h) {
          this.rtOutput.setSize(w, h);
        }
      }

      // ─── Renderer & Camera ────────────────────────────────────────────────────
      const scene = new THREE.Scene();
      // scene background is transparent — video shows through

      const camera = new THREE.PerspectiveCamera(
        30,
        innerWidth / innerHeight,
        1,
        100,
      );
      camera.position.set(-1, 0, 0).setLength(15);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        gu.aspect.value = camera.aspect;
      });

      // ─── Controls ─────────────────────────────────────────────────────────────
      const camShift = new THREE.Vector3(0, 1, 0);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.object.position.add(camShift);
      controls.target.add(camShift);

      // ─── Light ────────────────────────────────────────────────────────────────
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 3);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      // ─── Blob ─────────────────────────────────────────────────────────────────
      const blob = new Blob(renderer);

      // ─── Models ───────────────────────────────────────────────────────────────
      const loader = new GLTFLoader();

      const head = (await loader.loadAsync("./taban.glb")).scene.children[0];
      head.geometry.rotateY(Math.PI * 0.01);
      head.scale.setScalar(4.724);
      head.position.set(0.226, -0.569, 0.63);
      scene.add(head);

      const helmet = (
        await loader.loadAsync(
          "https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf",
        )
      ).scene.children[0];

      const helmetUniforms = { texBlob: { value: blob.rtOutput.texture } };

      helmet.material.onBeforeCompile = (shader) => {
        shader.uniforms.texBlob = helmetUniforms.texBlob;

        shader.vertexShader = `
        varying vec4 vPosProj;
        ${shader.vertexShader}
      `.replace(
          `#include <project_vertex>`,
          `#include <project_vertex>
          vPosProj = gl_Position;
        `,
        );

        shader.fragmentShader = `
        uniform sampler2D texBlob;
        varying vec4 vPosProj;
        ${shader.fragmentShader}
      `.replace(
          `#include <clipping_planes_fragment>`,
          `
        vec2 blobUV   = ((vPosProj.xy / vPosProj.w) + 1.) * 0.5;
        vec4 blobData = texture(texBlob, blobUV);
        if (blobData.r < 0.01) discard;
        #include <clipping_planes_fragment>
        `,
        );
      };

      helmet.scale.setScalar(3.5);
      helmet.position.set(0, 1.5, 0.75);
      scene.add(helmet);

      const helmetWire = new THREE.Mesh(
        helmet.geometry.clone().rotateX(Math.PI * 0.5),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          wireframe: true,
          transparent: true,
          opacity: 0.25,
          onBeforeCompile: (shader) => {
            shader.uniforms.time = gu.time;

            shader.vertexShader = `
            varying float vYVal;
            ${shader.vertexShader}
          `.replace(
              `#include <begin_vertex>`,
              `#include <begin_vertex>
              vYVal = position.y;
            `,
            );

            shader.fragmentShader = `
            uniform float time;
            varying float vYVal;
            ${shader.fragmentShader}
          `.replace(
              `#include <color_fragment>`,
              `#include <color_fragment>

              float y  = fract(vYVal * 0.25 + time * 0.5);
              float fY = smoothstep(0., 0.01, y) - smoothstep(0.02, 0.1, y);
              diffuseColor.a *= fY * 0.9 + 0.1;
            `,
            );
          },
        }),
      );
      helmetWire.scale.setScalar(3.5);
      helmetWire.position.set(0, 1.5, 0.75);
      scene.add(helmetWire);

      // ─── Render Loop ──────────────────────────────────────────────────────────
      const clock = new THREE.Clock();
      let t = 0;

      renderer.setAnimationLoop(() => {
        const dt = clock.getDelta();
        t += dt;
        gu.time.value = t;
        gu.dTime.value = dt;

        controls.update();
        blob.render();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
